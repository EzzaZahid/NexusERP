
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NexusERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="container">

        <div class="auth-card">

            <div class="text-center mb-4">

                <a href="index.html" class="brand-logo">
                    <i class="bi bi-grid-1x2-fill"></i>
                    NexusERP
                </a>

                <h3 class="fw-bold mt-4">Welcome Back!</h3>

                <p class="text-muted">
                    Login to access your workspace.
                </p>

            </div>


            <form id="loginForm">

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Email Address
                    </label>

                    <input type="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required>

                </div>


                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Login As
                    </label>

                    <select class="form-select" id="role" required>
                        <option value="">Select Dashboard Role</option>
                        <option value="admin">Administrator</option>
                        <option value="hr">HR Manager</option>
                        <option value="project-manager">Project Manager</option>
                        <option value="employee">Employee</option>
                        <option value="accountant">Accountant</option>
                    </select>
                </div>


                <div class="d-flex justify-content-between mb-4">

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label small">
                            Remember me
                        </label>
                    </div>

                    <a href="#" class="small text-primary">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="btn btn-primary w-100 py-2">
                    Login
                    <i class="bi bi-arrow-right ms-1"></i>
                </button>

            </form>


            <div class="text-center mt-4">

                <p class="text-muted mb-0">
                    Don't have an account?
                    <a href="signup.html" class="text-primary fw-semibold">
                        Sign Up
                    </a>
                </p>

                <a href="index.html" class="small text-muted d-inline-block mt-3">
                    <i class="bi bi-arrow-left"></i>
                    Back to Home
                </a>

            </div>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>
</html>
